name: Windows readiness

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693
        with:
          nim-version: '2.2.10'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make
      - name: Build, audit and run C and Go suites
        shell: msys2 {0}
        run: |
          mkdir -p build
          set -o pipefail
          bash scripts/build_windows.sh 2>&1 | tee build/windows.log
      - name: Capture symbols after failure
        if: failure()
        shell: msys2 {0}
        run: |
          if [[ -f build/windows-x86_64/libtkl_isolated.a ]]; then
            nm -g build/windows-x86_64/libtkl_isolated.a > build/windows-symbols.txt
          fi
          git ls-files --eol abi/exports-linux.txt > build/windows-line-endings.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: windows-readiness-diagnostics
          path: |
            build/windows*.txt
            build/windows.log
